services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    hostname: mlflow
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-mlflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-mlflow}
      - AWS_ACCESS_KEY_ID=${SEAWEED_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${SEAWEED_SECRET_KEY}

    env_file:
      - ./mlflow.env
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    labels:
      traefik.enable: true
      traefik.http.routers.mlflow.rule: Host(`mlflow.home.marcinszymanski.pl`)
      traefik.http.routers.mlflow.tls.certresolver: letsencrypt
      traefik.http.routers.mlflow.entrypoints: websecure
      traefik.http.routers.mlflow.tls: true
      traefik.docker.network: mlflow
    command: >
      bash -c "pip install 'psycopg2-binary' 'boto3' &&
      mlflow db upgrade postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-mlflow} &&
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-mlflow}
      --serve-artifacts
      --artifacts-destination s3://mlflow
      --host 0.0.0.0
      --port 5000"
    #--default-artifact-root s3://mlflow
    restart: always
    expose:
      - 5000
    networks:
      - mlflow

    deploy:
      resources:
        limits:
          memory: 4G

networks:
  mlflow:
    name: mlflow
    enable_ipv6: true
    ipam:
      config:
      - subnet: 2a01:4b00:ad59:aa00:0:2:3::/112

volumes:
  mlflow_artifacts:
