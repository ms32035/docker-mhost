services:

  traefik:
    image: traefik:latest
    container_name: "traefik"
    restart: always
    env_file:
      - traefik.env
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=desec"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.delaybeforecheck=120"
      - "--certificatesresolvers.letsencrypt.acme.email=ms32035@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 80
        published: 80
        protocol: tcp
        mode: host
    labels:
      traefik.enable: true
      traefik.http.routers.cert-grabber.rule: Host(`mhost.home.marcinszymanski.pl`)
      traefik.http.routers.cert-grabber.entrypoints: websecure
      traefik.http.routers.cert-grabber.tls: true
      traefik.http.routers.cert-grabber.tls.certresolver: letsencrypt
      traefik.http.routers.cert-grabber.service: noop@internal
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - ./volumes/letsencrypt:/letsencrypt
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      dagster:
      fairtrail:
      fitness:
      gfolio:
      jobs:
      llms:
      medikeep:
      mfinance:
      mlflow:
      ns2:
      openclaw:
        ipv6_address: 2a01:4b00:ad59:aa00:0:2:9:10
        ipv4_address: 172.16.2.10
      optuna:
      resume:
      securo:
      tools:


  certs-dumper:
    image: ldez/traefik-certs-dumper:v2.11.4
    restart: unless-stopped
    entrypoint: sh -c '
      apk add jq
      ; while ! [ -e /letsencrypt/acme.json ]
      || ! [ `jq ".[] | .Certificates | length" /letsencrypt/acme.json` != 0 ]; do
      sleep 1
      ; done
      && traefik-certs-dumper file --version v2 --watch --domain-subdir=true --source /letsencrypt/acme.json --dest /certs --post-hook "sh /post-hook.sh"'
    volumes:
      - ./volumes/letsencrypt/acme.json:/letsencrypt/acme.json:ro
      - ./volumes/certs:/certs
      - ./volumes/post-hook.sh:/post-hook.sh:ro
      - /etc/cockpit/ws-certs.d:/cockpit-certs
    labels:
      traefik.enable: false
    network_mode: host


networks:
  dagster:
    name: dagster
    external: true
  fairtrail:
    name: fairtrail
    external: true
  fitness:
    name: fitness
    external: true
  gfolio:
    name: gfolio
    external: true
  jobs:
    name: jobs
    external: true
  llms:
    name: llms
    external: true
  medikeep:
    name: medikeep
    external: true
  mfinance:
    name: mfinance
    external: true
  mlflow:
    name: mlflow
    external: true
  ns2:
    name: ns2
    external: true
  openclaw:
    name: openclaw
    external: true
  optuna:
    name: optuna
    external: true
  resume:
    name: resume
    external: true
  securo:
    name: securo
    external: true
  tools:
    name: tools
    external: true
