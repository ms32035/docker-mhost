services:
  netalert:
    container_name: netalert
    image: "ghcr.io/jokob-sk/netalertx"
    network_mode: "host"
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    sysctls: []
      #net.ipv4.conf.all.arp_ignore: 1
      #net.ipv4.conf.all.arp_announce: 2
    restart: always
    read_only: true
    volumes:
      - ./volumes/data:/data:rw
      - /etc/localtime:/etc/localtime:ro
    environment:
      LISTEN_ADDR: 0.0.0.0
      GRAPHQL_PORT: 20212
      PORT: 20211
      PUID: 20211
      PGID: 20211
    tmpfs:
    #  - "/tmp:mode=1700,uid=0,gid=0,rw,noexec,nosuid,nodev,async,noatime,nodiratime"
      - "/tmp:mode=1700,uid=20211,gid=20211,rw,noexec,nosuid,nodev,async,noatime,nodiratime"
    labels:
      traefik.enable: true
      traefik.http.routers.netalert.rule: Host(`netalert.home.marcinszymanski.pl`)
      traefik.http.routers.netalert.tls.certresolver: letsencrypt
      traefik.http.routers.netalert.entrypoints: websecure
      traefik.http.routers.netalert.tls: true
      traefik.http.services.netalertx.loadbalancer.server.port: 20211
      # traefik.http.routers.netalert.service: netalert
      # traefik.http.routers.netalert-api.rule: Host(`netalert.home.marcinszymanski.pl`) && PathPrefix(`/netalertx-api`)
      # traefik.http.routers.netalert-api.tls.certresolver: letsencrypt
      # traefik.http.routers.netalert-api.entrypoints: websecure
      # traefik.http.routers.netalert-api.tls: true
      # traefik.http.routers.netalert-api.service: netalert-api
      # traefik.http.routers.netalert-api.priority: 100
      # traefik.http.routers.netalert-api.middlewares: netalert-api-stripprefix
      # traefik.http.middlewares.netalert-api-stripprefix.stripprefix.prefixes: /netalertx-api
      # traefik.http.services.netalert.loadbalancer.server.url: http://netalert.home.marcinszymanski.pl:20211
      # traefik.http.services.netalert-api.loadbalancer.server.url: http://netalert.home.marcinszymanski.pl:20212
    pids_limit: 512
    mem_limit: 2048m
    logging:
      # driver: "none"
      options:
        max-size: "1m"
        max-file: "3"
