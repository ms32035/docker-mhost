name: securo

x-backend-base: &backend-base
  image: ghcr.io/securo-finance/securo-backend:latest
  env_file:
    - backend.env
  depends_on:
    redis: { condition: service_healthy }
  volumes:
    #- ./secrets:/app/secrets:ro
    - ./volumes/attachments:/app/data/attachments
    - ./volumes/agent_knowledge:/app/data/agent_knowledge
    - ./volumes/agent_embedding_models:/app/data/embedding_models
  restart: always

services:
  redis:
    image: redis:alpine
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - securo_backend



  backend:
    <<: *backend-base
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - securo_backend

  frontend:
    image: ghcr.io/securo-finance/securo-frontend:latest
    expose:
      - 8080
    env_file:
      - frontend.env
    depends_on:
      - backend
    restart: always
    networks:
      - securo
      - securo_backend
    labels:
      traefik.enable: true
      traefik.http.routers.securo_frontend.rule: Host(`securo.home.marcinszymanski.pl`)
      traefik.http.routers.securo_frontend.tls.certresolver: letsencrypt
      traefik.http.routers.securo_frontend.entrypoints: websecure
      traefik.http.routers.securo_frontend.tls: true
      traefik.docker.network: securo


  celery-worker:
    <<: *backend-base
    # Limit to 2 workers to save RAM (default = number of CPUs).
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    networks:
      - securo_backend

  celery-beat:
    <<: *backend-base
    command: celery -A app.worker beat --loglevel=info
    networks:
      - securo_backend

  # Optional: Securo built-in MCP server. Only starts under the `agents`
  # profile (`docker compose -f docker-compose.prod.yml --profile agents up`).
  # Reuses the backend image, just runs a different uvicorn entry point.
  # Modular by design — users not using the agents feature pay zero cost.
  #
  # The port is published on the host (127.0.0.1 by default) so external
  # agents — Claude Desktop, n8n, custom clients — can reach it after
  # minting a token from the UI. JWT auth is always required. Override
  # AGENTS_MCP_EXTERNAL_HOST_PORT to e.g. "0.0.0.0:8765" to expose to LAN.
  # mcp-server:
  #   <<: *backend-base
  #   command: uvicorn mcp_server.main:app --host 0.0.0.0 --port 8765
  #   ports:
  #     - "${AGENTS_MCP_EXTERNAL_HOST_PORT:-127.0.0.1:8765}:8765"

networks:
  securo:
    name: securo
    enable_ipv6: true
    ipam:
      config:
      - subnet: 2a01:4b00:ad59:aa00:0:2:18::/112
  securo_backend:
    name: securo_backend
    enable_ipv6: true
    ipam:
      config:
      - subnet: 2a01:4b00:ad59:aa00:0:2:19::/112
