services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    volumes:
      - "./volumes/open-webui:/app/backend/data"

    restart: always
    labels:
      traefik.enable: true
      traefik.http.routers.llms.rule: Host(`llms.home.marcinszymanski.pl`)
      traefik.http.routers.llms.tls.certresolver: letsencrypt
      traefik.http.routers.llms.entrypoints: websecure
      traefik.http.routers.llms.tls: true
      traefik.docker.network: llms
    env_file:
      - .env

    networks:
      - llms

networks:
  llms:
    name: llms
    enable_ipv6: true
    ipam:
      config:
      - subnet: 2a01:4b00:ad59:aa00:0:2:10::/112
